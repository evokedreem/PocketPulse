name: iOS CI

on:
  push:
    branches: [native-swiftui]
  pull_request:
    branches: [native-swiftui]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify branch is native-only
        shell: bash
        run: |
          TRACKED_FILES="$RUNNER_TEMP/pocketpulse-tracked-files.bin"
          git ls-files --stage -z > "$TRACKED_FILES"
          python3 -c '
          import os
          import re
          import sys
          from pathlib import Path, PurePosixPath

          records = [item for item in open(sys.argv[1], "rb").read().split(b"\0") if item]
          app_suffixes = {
              ".swift", ".h", ".m", ".mm", ".c", ".cc", ".cpp",
              ".plist", ".entitlements", ".xcconfig", ".strings", ".stringsdict",
              ".storyboard", ".xib", ".metal", ".json", ".png", ".jpg",
              ".jpeg", ".pdf", ".svg", ".heic", ".webp",
          }
          project_suffixes = {".pbxproj", ".xcscheme", ".plist", ".xcsettings", ".xcworkspacedata"}
          text_suffixes = {
              ".swift", ".h", ".m", ".mm", ".c", ".cc", ".cpp", ".plist",
              ".entitlements", ".xcconfig", ".strings", ".stringsdict", ".storyboard",
              ".xib", ".metal", ".json", ".pbxproj", ".xcscheme", ".xcsettings",
              ".xcworkspacedata",
          }
          forbidden_reference = re.compile(
              r"(?<![A-Za-z0-9_])(?:Expo(?:[A-Z0-9_][A-Za-z0-9_]*)?|React(?:[A-Z0-9_][A-Za-z0-9_]*)?|RCT(?:_[A-Za-z0-9_]+|[A-Z][A-Za-z0-9_]*))(?![A-Za-z0-9_])"
              r"|XCRemoteSwiftPackageReference|XCLocalSwiftPackageReference|XCSwiftPackageProductDependency"
          )
          allowed = []
          rejected = []
          reference_matches = []
          for record in records:
              metadata, raw_path = record.split(b"\t", 1)
              mode, _object_id, stage = metadata.split()
              path = os.fsdecode(raw_path)
              item = PurePosixPath(path)
              root = item.parts[0] if item.parts else ""
              suffix = item.suffix.lower()
              regular_file = mode in {b"100644", b"100755"} and stage == b"0"
              allowed_path = (
                  path in {".gitignore", "README.md"}
                  or (path.startswith(".github/workflows/") and suffix in {".yml", ".yaml"})
                  or (root in {"PocketPulse", "PocketPulseTests"} and suffix in app_suffixes)
                  or (root == "PocketPulse.xcodeproj" and suffix in project_suffixes)
                  or (root == "docs" and suffix in {".md", ".png", ".jpg", ".jpeg", ".pdf"})
                  or (root == "scripts" and suffix in {".py", ".sh"})
              )
              if not regular_file or not allowed_path:
                  rejected.append(f"{mode.decode()} stage={stage.decode()} {path}")
                  continue
              allowed.append(path)
              if root in {"PocketPulse", "PocketPulseTests", "PocketPulse.xcodeproj"} and suffix in text_suffixes:
                  text = Path(path).read_text(encoding="utf-8")
                  match = forbidden_reference.search(text)
                  if match:
                      line = text.count("\n", 0, match.start()) + 1
                      reference_matches.append(f"{path}:{line}: {match.group(0)}")
          if rejected:
              print("Unexpected tracked path or non-regular Git object:", *rejected, sep="\n", file=sys.stderr)
              sys.exit(1)
          if reference_matches:
              print("Expo, React, RCT, or package reference found:", *reference_matches, sep="\n", file=sys.stderr)
              sys.exit(1)
          print(f"Validated {len(allowed)} regular tracked native files")
          ' "$TRACKED_FILES"

      - name: Verify effective Xcode settings
        shell: bash
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          entitlements = plistlib.loads(Path("PocketPulse/PocketPulse.entitlements").read_bytes())
          if entitlements != {"com.apple.developer.healthkit": True}:
              raise SystemExit(f"Unexpected app entitlements: {entitlements!r}")
          PY
          for CONFIGURATION in Debug Release; do
            if [ "$CONFIGURATION" = "Debug" ]; then
              SDK=iphonesimulator
            else
              SDK=iphoneos
            fi
            xcodebuild \
              -project PocketPulse.xcodeproj \
              -target PocketPulse \
              -configuration "$CONFIGURATION" \
              -sdk "$SDK" \
              -showBuildSettings \
              -json > "build-settings-$CONFIGURATION.json"
            CONFIGURATION="$CONFIGURATION" python3 - <<'PY'
          import json
          import os

          path = "build-settings-" + os.environ["CONFIGURATION"] + ".json"
          entries = json.load(open(path, encoding="utf-8"))
          if len(entries) != 1:
              raise SystemExit(f"Expected one target in {path}, got {len(entries)}")
          settings = entries[0]["buildSettings"]
          expected = {
              "PRODUCT_BUNDLE_IDENTIFIER": "com.evokedreem.pocketpulse",
              "CODE_SIGN_ENTITLEMENTS": "PocketPulse/PocketPulse.entitlements",
              "CODE_SIGN_STYLE": "Automatic",
              "IPHONEOS_DEPLOYMENT_TARGET": "17.0",
              "TARGETED_DEVICE_FAMILY": "1",
              "INFOPLIST_KEY_NSHealthShareUsageDescription": "PocketPulse reads health data you choose to show your personal dashboard, history, and trends.",
              "INFOPLIST_KEY_NSHealthUpdateUsageDescription": "PocketPulse saves only the health entries you enter to Apple Health.",
          }
          wrong = {
              key: (settings.get(key), value)
              for key, value in expected.items()
              if settings.get(key) != value
          }
          if wrong:
              raise SystemExit(
                  "Wrong effective settings for "
                  + os.environ["CONFIGURATION"]
                  + ": "
                  + repr(wrong)
              )
          PY
          done

      - name: Build unsigned Release for iPhone device SDK
        run: |
          xcodebuild \
            -project PocketPulse.xcodeproj \
            -scheme PocketPulse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Select an available iPhone Simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; data=json.load(sys.stdin)["devices"]; ids=[device["udid"] for devices in data.values() for device in devices if "iPhone" in device["name"] and device.get("isAvailable", True)]; print(ids[-1] if ids else "")')
          test -n "$DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run Debug unit tests
        run: |
          xcodebuild \
            -project PocketPulse.xcodeproj \
            -scheme PocketPulse \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/PocketPulseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Launch native app and capture Summary screen
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID='${{ steps.simulator.outputs.id }}'
          APP_PATH="$RUNNER_TEMP/PocketPulseDerivedData/Build/Products/Debug-iphonesimulator/PocketPulse.app"
          SCREENSHOT_PATH="$RUNNER_TEMP/pocketpulse-summary.png"
          test -d "$APP_PATH"
          xcrun simctl boot "$DEVICE_ID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override \
            --time '9:41' \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4
          xcrun simctl uninstall "$DEVICE_ID" com.evokedreem.pocketpulse >/dev/null 2>&1 || true
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          LAUNCH_OUTPUT=$(xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.evokedreem.pocketpulse)
          printf '%s\n' "$LAUNCH_OUTPUT"
          printf '%s\n' "$LAUNCH_OUTPUT" | grep -Eq '^com\.evokedreem\.pocketpulse: [0-9]+$'
          xcrun simctl io "$DEVICE_ID" screenshot "$SCREENSHOT_PATH"
          test -s "$SCREENSHOT_PATH"
          file "$SCREENSHOT_PATH" | grep -Fq 'PNG image data'

      - name: Upload visual validation screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pocketpulse-summary-screen
          path: ${{ runner.temp }}/pocketpulse-summary.png
          if-no-files-found: error
          retention-days: 7
