name: PocketPulse
options:
  bundleIdPrefix: com.evokedreem
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0

targets:
  PocketPulse:
    type: application
    platform: iOS
    sources:
      - PocketPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evokedreem.PocketPulse
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    scheme:
      testTargets:
        - PocketPulseTests

  PocketPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PocketPulseTests
    dependencies:
      - target: PocketPulse
