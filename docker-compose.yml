services:
  expo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pocketpulse-expo
    environment:
      EXPO_NO_TELEMETRY: "1"
    init: true
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:18081:8081"
    restart: unless-stopped
    volumes:
      - .:/app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8081/status').then(async
          r=>process.exit((await r.text()).includes('packager-status:running')?0:1)).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 45s
